name: Připravit náhledy a zprávu o médiích
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Kontext Pages CMS (JSON)
        required: false
        type: string
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Připravit WebP náhledy bez změny originálů
        run: npm run media:prepare
      - name: Uložit redakční zprávy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redakcni-kontroly
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Uložit náhledy pro kontrolu
        uses: actions/upload-artifact@v4
        with:
          name: nahledy-fotografii
          path: public/_media/
          retention-days: 3
