name: Ověřit a publikovat GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      payload:
        description: Kontext akce Pages CMS (JSON)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v5
      - name: Připravit Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalovat závislosti
        run: npm ci
      - name: Lint a regresní testy
        run: npm run lint && npm run test:unit
      - name: Ověřit obsah a Pages CMS
        run: npm run check
      - name: Zjistit doménu a cestu GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Obnovit cache náhledů
        uses: actions/cache@v4
        with:
          path: |
            public/_media
            src/data/generated-media.json
          key: media-v1-${{ runner.os }}-${{ hashFiles('public/**/*.jpg', 'public/**/*.jpeg', 'public/**/*.png', 'public/**/*.webp', 'public/**/*.avif', 'scripts/prepare-media.mjs') }}
          restore-keys: media-v1-${{ runner.os }}-
      - name: Sestavit web, náhledy a Pagefind
        env:
          ASTRO_BASE: ${{ steps.pages.outputs.base_path }}
          ASTRO_SITE: ${{ steps.pages.outputs.origin }}
        run: npm run build
      - name: Ověřit odkazy, soubory, kotvy a cílovou doménu
        run: npm run check:links && node scripts/check-deployment.mjs
      - name: Uložit zprávy pro redakci
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redakcni-kontroly
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Vysvětlit neúspěšnou publikaci
        if: failure()
        run: echo "Web nebyl publikován. Poslední úspěšná verze zůstává dostupná. Otevřete první červený krok a artefakt redakcni-kontroly; chybu opravte v Pages CMS a uložte znovu." >> "$GITHUB_STEP_SUMMARY"
      - name: Připravit ověřený web k publikaci
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publikovat
        id: deployment
        uses: actions/deploy-pages@v4
