name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action context (JSON)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate content and Pages CMS configuration
        run: npm run check
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build Astro site and Pagefind index
        env:
          ASTRO_BASE: ${{ steps.pages.outputs.base_path }}
          ASTRO_SITE: https://${{ github.repository_owner }}.github.io
        run: npm run build
      - name: Check internal links
        env:
          ASTRO_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run check:links
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
