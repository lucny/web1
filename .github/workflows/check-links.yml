name: Kontrola odkazů a přístupnosti HTML
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Kontext Pages CMS (JSON)
        required: false
        type: string
permissions:
  contents: read
jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ověřit obsah
        run: npm run check
      - name: Sestavit web a hledání
        run: npm run build
      - name: Ověřit odkazy a soubory
        run: npm run check:links
      - name: Uložit redakční zprávy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redakcni-kontroly
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
